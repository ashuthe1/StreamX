services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - streamx-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - streamx-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - streamx-net

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - ${HOME}/data/postgresdata:/var/lib/postgresql/data
    networks:
      - streamx-net

  redis-db:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"         # expose Redis for local tooling if needed
    networks:
      - streamx-net

  # Two backend replicas
  app-asia:
    container_name: app-asia
    build:
      context: ./
      dockerfile: backend.dockerfile
    environment:
      - SERVER_NAME=Asia
      - REDIS_ADDR=redis-db:6379
      - KAFKA_ADDR=kafka:9092
      - WS_PORT=3001
    depends_on:
      - kafka
      - db
      - redis-db
    networks:
      - streamx-net

  app-europe:
    container_name: app-europe
    build:
      context: ./
      dockerfile: backend.dockerfile
    environment:
      - SERVER_NAME=Europe
      - REDIS_ADDR=redis-db:6379
      - KAFKA_ADDR=kafka:9092
      - WS_PORT=3001
    depends_on:
      - kafka
      - db
      - redis-db
    networks:
      - streamx-net

  frontend:
    container_name: frontend
    build:
      context: ./
      dockerfile: frontend.dockerfile
    ports:
      - "4000:4000"
    networks:
      - streamx-net

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - app-asia
      - app-europe
      - frontend
    networks:
      - streamx-net

networks:
  streamx-net:
    driver: bridge
